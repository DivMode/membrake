    <rect x="30" y="106" width="6" height="14" rx="2"/><rect x="47" y="106" width="6" height="14" rx="2"/><rect x="64" y="106" width="6" height="14" rx="2"/><rect x="81" y="106" width="6" height="14" rx="2"/>
    <rect x="8" y="30" width="14" height="6" rx="2"/><rect x="8" y="47" width="14" height="6" rx="2"/><rect x="8" y="64" width="14" height="6" rx="2"/><rect x="8" y="81" width="14" height="6" rx="2"/>
    <rect x="106" y="30" width="14" height="6" rx="2"/><rect x="106" y="47" width="14" height="6" rx="2"/><rect x="106" y="64" width="14" height="6" rx="2"/><rect x="106" y="81" width="14" height="6" rx="2"/>
