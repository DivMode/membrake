  </g>
  <!-- caliper gripping the disc -->
  <path d="M76 30 h14 a8 8 0 0 1 8 8 v18 a8 8 0 0 1 -8 8 h-14 z" fill="#ef4444"/>
  <rect x="80" y="38" width="4" height="18" rx="2" fill="#fecaca"/>
